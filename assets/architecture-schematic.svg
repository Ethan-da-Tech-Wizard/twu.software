<svg viewBox="0 0 800 240" fill="none" xmlns="http://www.w3.org/2000/svg" class="architecture-svg">
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="200" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="flowCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="flowViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="archGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Air-Gap Boundary Perimeter -->
  <rect x="10" y="10" width="780" height="220" rx="16" fill="rgba(10, 15, 26, 0.6)" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="32" y="36" fill="#00f0ff" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1.5">AIR-GAPPED CLIENT PERIMETER // ZERO EXTERNAL TELEMETRY</text>

  <!-- Node 1: Local Input Documents / Raw Workflows -->
  <g transform="translate(40, 60)">
    <rect width="180" height="140" rx="12" fill="url(#boxGrad)" stroke="#1f293d" stroke-width="1.5"/>
    <rect x="16" y="20" width="36" height="36" rx="8" fill="rgba(0, 240, 255, 0.1)" stroke="#00f0ff" stroke-width="1"/>
    <!-- Doc icon -->
    <path d="M28 32H40M28 38H36" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round"/>
    <text x="16" y="80" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Client Operations</text>
    <text x="16" y="100" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Paperwork, Spreadsheets,</text>
    <text x="16" y="116" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Proprietary Records</text>
    <rect x="16" y="132" width="148" height="3" rx="1.5" fill="#00f0ff"/>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M230 130H300" stroke="url(#flowCyan)" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="300,126 308,130 300,134" fill="#6366f1"/>

  <!-- Node 2: The TWU Sovereign Engine (Local Weights) -->
  <g transform="translate(310, 50)">
    <rect width="200" height="160" rx="14" fill="#0b1120" stroke="#6366f1" stroke-width="2" filter="url(#archGlow)"/>
    <rect x="18" y="18" width="40" height="40" rx="10" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1.2"/>
    <!-- CPU/AI core -->
    <rect x="28" y="28" width="20" height="20" rx="3" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="38" cy="38" r="3" fill="#00f0ff"/>
    <text x="18" y="82" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">TWU Sovereign Core</text>
    <text x="18" y="104" fill="#a855f7" font-family="monospace" font-size="11" font-weight="600">Local Neural Models</text>
    <text x="18" y="122" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Runs on your local Mac/PC.</text>
    <text x="18" y="138" fill="#10b981" font-family="monospace" font-size="11">✓ Zero Monthly API Subscriptions</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M520 130H590" stroke="url(#flowViolet)" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="590,126 598,130 590,134" fill="#10b981"/>

  <!-- Node 3: Sovereign Verified Output -->
  <g transform="translate(600, 60)">
    <rect width="170" height="140" rx="12" fill="url(#boxGrad)" stroke="#1f293d" stroke-width="1.5"/>
    <rect x="16" y="20" width="36" height="36" rx="8" fill="rgba(16, 185, 129, 0.1)" stroke="#10b981" stroke-width="1"/>
    <!-- Checkmark & gear -->
    <path d="M28 38L32 42L40 34" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="16" y="80" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Finished Output</text>
    <text x="16" y="100" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Automated Reports,</text>
    <text x="16" y="116" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Clean Data, 100% Owned</text>
    <rect x="16" y="132" width="138" height="3" rx="1.5" fill="#10b981"/>
  </g>
</svg>
