<svg viewBox="0 0 960 380" fill="none" xmlns="http://www.w3.org/2000/svg" class="architecture-svg">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="archGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 240, 255, 0.05)" stroke-width="1"/>
      <circle cx="30" cy="0" r="1.5" fill="rgba(168, 85, 247, 0.25)"/>
    </pattern>

    <!-- Node Gradients -->
    <linearGradient id="clientCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1324"/>
      <stop offset="50%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#050812"/>
    </linearGradient>

    <linearGradient id="coreCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190e38"/>
      <stop offset="50%" stop-color="#0e0a22"/>
      <stop offset="100%" stop-color="#060412"/>
    </linearGradient>

    <linearGradient id="outputCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061f18"/>
      <stop offset="50%" stop-color="#051410"/>
      <stop offset="100%" stop-color="#040b09"/>
    </linearGradient>

    <!-- Conduit Gradients -->
    <linearGradient id="conduitIn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="conduitOut" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="borderCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="40%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlowViolet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .flow-dash {
      stroke-dasharray: 8 8;
      animation: flowAnim 1.6s linear infinite;
    }
    @keyframes flowAnim {
      from { stroke-dashoffset: 32; }
      to { stroke-dashoffset: 0; }
    }
    .pulse-glow {
      animation: pulseAnim 3s ease-in-out infinite alternate;
    }
    @keyframes pulseAnim {
      0% { opacity: 0.55; }
      100% { opacity: 1; filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.7)); }
    }
  </style>

  <!-- Ground Grid Layer -->
  <rect width="960" height="380" fill="#04060e"/>
  <rect width="960" height="380" fill="url(#archGrid)"/>

  <!-- Ambient Wizard Glow Aura behind center core -->
  <circle cx="480" cy="205" r="180" fill="rgba(168, 85, 247, 0.12)" filter="url(#neonGlowViolet)"/>
  <circle cx="480" cy="205" r="90" fill="rgba(0, 240, 255, 0.10)"/>

  <!-- Sovereign Air-Gap Perimeter Fence -->
  <rect x="18" y="16" width="924" height="348" rx="16" fill="rgba(6, 10, 20, 0.75)" stroke="rgba(0, 240, 255, 0.35)" stroke-width="1.5" stroke-dasharray="10 6"/>

  <!-- Corner Tech Brackets -->
  <!-- Top Left -->
  <path d="M 12 36 L 12 16 L 36 16" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
  <!-- Top Right -->
  <path d="M 948 36 L 948 16 L 924 16" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
  <!-- Bottom Left -->
  <path d="M 12 344 L 12 364 L 36 364" fill="none" stroke="#a855f7" stroke-width="2.5"/>
  <!-- Bottom Right -->
  <path d="M 948 344 L 948 364 L 924 364" fill="none" stroke="#a855f7" stroke-width="2.5"/>

  <!-- Perimeter Top Header Bar -->
  <g transform="translate(36, 44)">
    <circle cx="6" cy="0" r="4" fill="#00f0ff" filter="url(#neonGlowCyan)"/>
    <text x="18" y="4" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="2">AIR-GAPPED CLIENT PERIMETER // ZERO CLOUD HARVESTING // 100% OFFLINE</text>
    <rect x="740" y="-10" width="135" height="22" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
    <text x="748" y="5" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" letter-spacing="1">✓ ENCLAVE SECURED</text>
  </g>

  <!-- Connective Data Conduit: Node 1 -> Node 2 -->
  <g>
    <!-- Background track -->
    <path d="M 275 205 L 355 205" stroke="rgba(0, 240, 255, 0.2)" stroke-width="5" stroke-linecap="round"/>
    <!-- Animated Energy Conduit -->
    <path d="M 275 205 L 355 205" stroke="url(#conduitIn)" stroke-width="3" stroke-linecap="round" class="flow-dash"/>
    <!-- Pulsing Arrow Head -->
    <polygon points="354,199 364,205 354,211" fill="#a855f7"/>
    <!-- Flow Descriptor -->
    <rect x="278" y="172" width="76" height="18" rx="4" fill="#060c18" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1"/>
    <text x="284" y="185" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">LOCAL BUS</text>
  </g>

  <!-- Connective Data Conduit: Node 2 -> Node 3 -->
  <g>
    <!-- Background track -->
    <path d="M 605 205 L 685 205" stroke="rgba(168, 85, 247, 0.2)" stroke-width="5" stroke-linecap="round"/>
    <!-- Animated Energy Conduit -->
    <path d="M 605 205 L 685 205" stroke="url(#conduitOut)" stroke-width="3" stroke-linecap="round" class="flow-dash"/>
    <!-- Pulsing Arrow Head -->
    <polygon points="684,199 694,205 684,211" fill="#10b981"/>
    <!-- Flow Descriptor -->
    <rect x="608" y="172" width="76" height="18" rx="4" fill="#060c18" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <text x="614" y="185" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">AIRGAP SHIP</text>
  </g>

  <!-- ========================================== -->
  <!-- NODE 1: CLIENT OPERATIONS (Raw Workflows)  -->
  <!-- ========================================== -->
  <g transform="translate(48, 88)">
    <!-- Card Frame -->
    <rect width="225" height="234" rx="14" fill="url(#clientCardGrad)" stroke="rgba(0, 240, 255, 0.45)" stroke-width="1.5"/>
    <rect x="1" y="1" width="223" height="4" rx="2" fill="#00f0ff"/>

    <!-- Vault / Ingestion Icon -->
    <rect x="22" y="24" width="46" height="46" rx="10" fill="rgba(0, 240, 255, 0.12)" stroke="#00f0ff" stroke-width="1.2"/>
    <path d="M 37 38 L 53 38 M 37 45 L 49 45 M 37 52 L 45 52" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="53" cy="51" r="3" fill="#38bdf8"/>

    <!-- Content -->
    <text x="22" y="98" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="700">Client Operations</text>
    <text x="22" y="118" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">INPUT INGESTION</text>

    <text x="22" y="146" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" line-height="1.4">
      • Proprietary Files &amp; Databases
    </text>
    <text x="22" y="166" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">
      • Spreadsheets &amp; Internal Docs
    </text>
    <text x="22" y="186" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">
      • Local Network Perimeter
    </text>

    <!-- Bottom Tag -->
    <rect x="20" y="206" width="185" height="18" rx="4" fill="rgba(0, 240, 255, 0.08)" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1"/>
    <text x="28" y="219" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">⚡ ZERO THIRD-PARTY EGRESS</text>
  </g>

  <!-- ========================================== -->
  <!-- NODE 2: TWU SOVEREIGN CORE (The Wizard)    -->
  <!-- ========================================== -->
  <g transform="translate(358, 70)" class="pulse-glow">
    <!-- Elevated Aura Card -->
    <rect width="244" height="270" rx="16" fill="url(#coreCardGrad)" stroke="url(#borderCore)" stroke-width="2" filter="url(#neonGlowViolet)"/>
    <!-- Top Wizard Energy Ribbon -->
    <rect x="2" y="2" width="240" height="5" rx="2" fill="url(#borderCore)"/>

    <!-- Arcane Neural Reactor Core Icon -->
    <rect x="24" y="24" width="52" height="52" rx="12" fill="rgba(168, 85, 247, 0.2)" stroke="#c084fc" stroke-width="1.8"/>
    <!-- Concentric Arcane Rings & Tensor Node -->
    <circle cx="50" cy="50" r="16" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="3 3"/>
    <rect x="42" y="42" width="16" height="16" rx="3" fill="#7c3aed" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="3.5" fill="#00f0ff" filter="url(#neonGlowCyan)"/>

    <!-- Title & Specs -->
    <text x="24" y="104" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="19" font-weight="800" letter-spacing="-0.3">TWU Sovereign Core</text>
    <text x="24" y="126" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">LOCAL NEURAL ENGINE</text>

    <!-- Capabilities -->
    <g transform="translate(24, 142)">
      <circle cx="4" cy="10" r="2.5" fill="#00f0ff"/>
      <text x="14" y="14" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="600">Local Weight Inference</text>

      <circle cx="4" cy="32" r="2.5" fill="#c084fc"/>
      <text x="14" y="36" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="600">Runs On In-House Metal / Mac</text>

      <circle cx="4" cy="54" r="2.5" fill="#10b981"/>
      <text x="14" y="58" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="600">Zero Cloud API Subscriptions</text>
    </g>

    <!-- Bottom Sovereign Badge -->
    <rect x="20" y="234" width="204" height="22" rx="5" fill="rgba(168, 85, 247, 0.18)" stroke="#a855f7" stroke-width="1.2"/>
    <text x="30" y="249" fill="#e9d5ff" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1">⚡ 100% OFF-GRID CAPABLE</text>
  </g>

  <!-- ========================================== -->
  <!-- NODE 3: FINISHED OUTPUT (Proprietary IP)   -->
  <!-- ========================================== -->
  <g transform="translate(688, 88)">
    <!-- Card Frame -->
    <rect width="225" height="234" rx="14" fill="url(#outputCardGrad)" stroke="rgba(16, 185, 129, 0.55)" stroke-width="1.5"/>
    <rect x="1" y="1" width="223" height="4" rx="2" fill="#10b981"/>

    <!-- Cryptographic Shield / Delivery Icon -->
    <rect x="22" y="24" width="46" height="46" rx="10" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.2"/>
    <path d="M 45 34 L 54 38 V 46 C 54 52 45 57 45 57 C 45 57 36 52 36 46 V 38 Z" fill="none" stroke="#10b981" stroke-width="1.6"/>
    <path d="M 41 45 L 44 48 L 49 42" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Content -->
    <text x="22" y="98" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="700">Finished Output</text>
    <text x="22" y="118" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">VERIFIED DELIVERABLE</text>

    <text x="22" y="146" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">
      • Production-Ready Software
    </text>
    <text x="22" y="166" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">
      • Automated Reports &amp; Pipelines
    </text>
    <text x="22" y="186" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">
      • 100% Client Ownership
    </text>

    <!-- Bottom Tag -->
    <rect x="20" y="206" width="185" height="18" rx="4" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <text x="26" y="219" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">✓ PERPETUAL CLIENT LICENSE</text>
  </g>
</svg>