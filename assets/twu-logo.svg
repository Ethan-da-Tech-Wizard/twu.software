<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Octagon Badge with Gold/Amber Border -->
  <polygon points="14,4 34,4 44,14 44,34 34,44 14,44 4,34 4,14" fill="#070a14" stroke="#f59e0b" stroke-width="2"/>

  <!-- Emerald Green Crosshair Reticle -->
  <circle cx="24" cy="24" r="14" stroke="#10b981" stroke-width="1.4" stroke-opacity="0.85"/>
  <line x1="24" y1="5" x2="24" y2="10" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="38" x2="24" y2="43" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="5" y1="24" x2="10" y2="24" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38" y1="24" x2="43" y2="24" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Master Monogram: Coral/Rose TW Glyphs -->
  <!-- Letter W -->
  <path d="M15 22L19 32L24 24L29 32L33 22" stroke="#fb7185" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Letter T -->
  <path d="M14 16H34" stroke="#fbbf24" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M24 16V27" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Central Emerald Target Spark -->
  <circle cx="24" cy="24" r="2.2" fill="#10b981" filter="url(#goldGlow)"/>
  <circle cx="24" cy="24" r="1.1" fill="#ffffff"/>
</svg>
